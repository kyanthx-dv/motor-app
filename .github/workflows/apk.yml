name: APK
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: kyanthx-dv/motor, path: motor-src }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Motor para assets/web
        run: tool/copiar_motor.sh motor-src && tool/gerar_assets.sh
      - name: Gerar projeto Android (so a pasta android/)
        run: |
          flutter create --platforms=android --org com.kyanthx --project-name motor_app ../gerado
          rm -rf android && cp -r ../gerado/android android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"#' "$M"
          sed -i 's#android:label="[^"]*"#android:label="Motor"#' "$M"
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: motor-app-apk, path: build/app/outputs/flutter-apk/app-release.apk }
