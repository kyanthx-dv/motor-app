name: APK
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: kyanthx-dv/motor, path: motor-src }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Motor para assets/web
        run: tool/copiar_motor.sh motor-src && tool/gerar_assets.sh
      - name: Gerar projeto Android (so a pasta android/)
        run: |
          flutter create --platforms=android --org com.kyanthx --project-name motor_app ../gerado
          rm -rf android && cp -r ../gerado/android android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"#' "$M"
          sed -i 's#android:label="[^"]*"#android:label="Blocky"#' "$M"
      - name: Desligar lint vital (o lint do Android quebra ao ler o plugin da WebView; nao afeta o APK)
        run: |
          mkdir -p ~/.gradle/init.d
          printf "allprojects { tasks.configureEach { t -> if (t.name.startsWith('lintVital')) t.enabled = false } }\n" > ~/.gradle/init.d/sem-lint.gradle
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: motor-app-apk, path: build/app/outputs/flutter-apk/app-release.apk }
      - name: Publicar APK na Release "ultimo" (link fixo para baixar no celular)
        if: github.event_name != 'pull_request'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk motor-app.apk
          gh release delete ultimo --yes --cleanup-tag || true
          gh release create ultimo motor-app.apk --prerelease --title "APK mais recente" --notes "Gerado automaticamente a cada push na main. Baixe motor-app.apk e instale (permita instalar de fonte desconhecida)."
